<!DOCTYPE html>
<html>
<head>
    <title>Video Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

    <!-- Left Side -->
    <div class="sidebar">

        <h2>VideoHub</h2>

        <p>Home</p>
        <p>Trending</p>
        <p>Videos</p>
        <p>Watch Later</p>
        <p>Liked Videos</p>

        <h4>SUBSCRIPTIONS</h4>

        <p>Tech World</p>
        <p>Travel Life</p>
        <p>Gaming Zone</p>
        <p>Food Corner</p>

    </div>


    <!-- Right Side -->
    <div class="right">

        <!-- Top -->
        <div class="top">

            <h3>☰</h3>

            <input type="text" placeholder="Search">

            <p>🔔　👤</p>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button>All</button>
            <button>Technology</button>
            <button>Travel</button>
            <button>Gaming</button>
            <button>Music</button>
            <button>Sports</button>

        </div>


        <!-- Big Image -->
        <div class="banner">

            <img src="https://picsum.photos/900/250?random=10">

        </div>


        <!-- Cards -->
        <div class="cards">

            <div class="card">
                <img src="https://picsum.photos/200/120?random=1">
                <h3>New Technology</h3>
                <p>Tech World</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200/120?random=2">
                <h3>Beautiful Places</h3>
                <p>Travel Life</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200/120?random=3">
                <h3>Easy Cooking</h3>
                <p>Food Corner</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/200/120?random=4">
                <h3>Gaming Setup</h3>
                <p>Gaming Zone</p>
            </div>


        </div>

    </div>

</div>

</body>
</html>
